# ---------------------------------------------------------------------------
# Manifest: Sensitivity Analysis (tau, n) at T=50 for SYNASC revision
# ---------------------------------------------------------------------------

base_config_path: configs/config_mackey_glass_t200_windowed.yaml
output_root: results/fast_sensitivity_runs

n_value: 10.0
ref_dt: 0.001
failure_mse_multiplier: 10.0
baseline_run_id_for_failure: Sens_n10_tau2

default_seeds:
  - 42

valid_thresholds:
  - 0.05
  - 0.1
  - 0.2

runs:
  - run_id: Sens_n10_tau2
    phase_id: "Sensitivity"
    merge_patch:
      problem:
        time_span: [0.0, 50.0]
        n: 10.0
        tau: 2.0
      data:
        t_total: 50.0
      training:
        iterations:
          main: 15000

  - run_id: Sens_n10_tau3_18
    phase_id: "Sensitivity"
    merge_patch:
      problem:
        time_span: [0.0, 50.0]
        n: 10.0
        tau: 3.18
      data:
        t_total: 50.0
      training:
        iterations:
          main: 15000

  - run_id: Sens_n14_tau2
    phase_id: "Sensitivity"
    merge_patch:
      problem:
        time_span: [0.0, 50.0]
        n: 14.0
        tau: 2.0
      data:
        t_total: 50.0
      training:
        iterations:
          main: 15000

  - run_id: Sens_n14_tau3_18
    phase_id: "Sensitivity"
    merge_patch:
      problem:
        time_span: [0.0, 50.0]
        n: 14.0
        tau: 3.18
      data:
        t_total: 50.0
      training:
        iterations:
          main: 15000
