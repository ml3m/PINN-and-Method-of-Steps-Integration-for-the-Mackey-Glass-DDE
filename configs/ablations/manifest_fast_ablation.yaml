# ---------------------------------------------------------------------------
# Manifest: Fast Ablation (T=50, 3 windows) for SYNASC revision
# ---------------------------------------------------------------------------

base_config_path: configs/config_mackey_glass_t200_windowed.yaml
output_root: results/fast_ablation_runs

n_value: 10.0
ref_dt: 0.001
failure_mse_multiplier: 10.0
baseline_run_id_for_failure: Fast_B0_baseline

default_seeds:
  - 42

valid_thresholds:
  - 0.05
  - 0.1
  - 0.2

runs:
  - run_id: Fast_B0_baseline
    phase_id: "FastAblation"
    merge_patch:
      problem:
        time_span: [0.0, 50.0]
      data:
        t_total: 50.0
      training:
        iterations:
          main: 15000

  - run_id: Fast_M1_no_lbfgs
    phase_id: "FastAblation"
    merge_patch:
      problem:
        time_span: [0.0, 50.0]
      data:
        t_total: 50.0
      training:
        iterations:
          main: 15000
        n_lbfgs: 0

  - run_id: Fast_M2_no_fourier
    phase_id: "FastAblation"
    merge_patch:
      problem:
        time_span: [0.0, 50.0]
      data:
        t_total: 50.0
      training:
        iterations:
          main: 15000
      network:
        fourier_features: false

  - run_id: Fast_M3_no_curriculum
    phase_id: "FastAblation"
    merge_patch:
      problem:
        time_span: [0.0, 50.0]
      data:
        t_total: 50.0
      training:
        iterations:
          main: 15000
        curriculum: false

  - run_id: Fast_M4_single_window
    phase_id: "FastAblation"
    merge_patch:
      problem:
        time_span: [0.0, 50.0]
      data:
        t_total: 50.0
      training:
        iterations:
          main: 15000
        window_size: 50.0
        window_overlap: 0.0

  - run_id: Fast_M5_unweighted_loss
    phase_id: "FastAblation"
    merge_patch:
      problem:
        time_span: [0.0, 50.0]
      data:
        t_total: 50.0
      training:
        iterations:
          main: 15000
        loss_weights:
          data_loss: 1.0
          physics_loss: 1.0
          history_loss: 1.0
          ic_loss: 1.0
